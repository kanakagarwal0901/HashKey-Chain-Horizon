<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ShunyaGrid Protocol Monolith">
  <title>ShunyaGrid Protocol Monolith</title>
  <desc>Zero-Cutoff Confidential AI Exchange • HashKey Chain Horizon</desc>

  <defs>
    <!-- Primary Quantum Teal-to-Emerald Gradient -->
    <linearGradient id="sg-zenith-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Deep Foundation Facet Gradient -->
    <linearGradient id="sg-nadir-vault" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="40%" stop-color="#059669" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <!-- Central TEE Singularity Plasma -->
    <radialGradient id="sg-singularity-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#00F2FE" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#10B981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Specular Caustic Glint -->
    <linearGradient id="sg-caustic-glint" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <clipPath id="sg-monolith-clip">
      <path d="M 28 48 C 28 32 38 18 54 18 C 72 18 82 30 82 46 C 82 54 77 60 70 63 L 58 51 C 61 48 64 45 64 42 C 64 34 58 29 52 29 C 43 29 39 36 39 44 C 39 48 42 52 48 55 L 40 63 C 32 58 28 53 28 48 Z M 72 52 C 72 68 62 82 46 82 C 28 82 18 70 18 54 C 18 46 23 40 30 37 L 42 49 C 39 52 36 55 36 58 C 36 66 42 71 48 71 C 57 71 61 64 61 56 C 61 52 58 48 52 45 L 60 37 C 68 42 72 47 72 52 Z" />
    </clipPath>

    <filter id="sg-core-flare" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Grounding Obsidian Tile -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="#0A0D14" stroke="#1E293B" stroke-width="1" />

  <!-- Alignment Reticles -->
  <path d="M 50 10 L 50 16 M 50 84 L 50 90 M 10 50 L 16 50 M 84 50 L 90 50"
        stroke="#334155" stroke-width="1" opacity="0.4" />

  <!-- The Architectural S-0 Monolith -->
  <g>
    <!-- Upper Cantilever -->
    <path d="M 28 48 C 28 32 38 18 54 18 C 72 18 82 30 82 46 C 82 54 77 60 70 63 L 58 51 C 61 48 64 45 64 42 C 64 34 58 29 52 29 C 43 29 39 36 39 44 C 39 48 42 52 48 55 L 40 63 C 32 58 28 53 28 48 Z"
          fill="url(#sg-zenith-beam)" />

    <!-- Lower Cantilever -->
    <path d="M 72 52 C 72 68 62 82 46 82 C 28 82 18 70 18 54 C 18 46 23 40 30 37 L 42 49 C 39 52 36 55 36 58 C 36 66 42 71 48 71 C 57 71 61 64 61 56 C 61 52 58 48 52 45 L 60 37 C 68 42 72 47 72 52 Z"
          fill="url(#sg-nadir-vault)" />

    <!-- Caustic Glint Sweep -->
    <g clip-path="url(#sg-monolith-clip)">
      <rect x="-100" y="0" width="300" height="100" fill="url(#sg-caustic-glint)">
        <animateTransform attributeName="transform" type="translate"
                          from="-120 0" to="120 0" dur="4.5s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Central TEE Singularity Core -->
    <g>
      <circle cx="50" cy="50" r="10" fill="url(#sg-singularity-glow)" filter="url(#sg-core-flare)" opacity="0.85">
        <animateTransform attributeName="transform" type="scale"
                          values="0.94; 1.08; 0.94" keyTimes="0; 0.5; 1" dur="3.6s" repeatCount="indefinite" additive="sum" />
        <animateTransform attributeName="transform" type="translate"
                          values="3 3; -4 -4; 3 3" keyTimes="0; 0.5; 1" dur="3.6s" repeatCount="indefinite" additive="sum" />
      </circle>
      <polygon points="50,44 56,50 50,56 44,50" fill="url(#sg-zenith-beam)" stroke="#FFFFFF" stroke-width="0.8" />
      <circle cx="50" cy="50" r="1.5" fill="#FFFFFF" />
    </g>
  </g>
</svg>
