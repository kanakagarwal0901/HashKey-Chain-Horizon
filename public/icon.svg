<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="shunyaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>
    <linearGradient id="cipherEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="enclaveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Silicon Die Pins (8 Hardware Attestation Pins) -->
  <g stroke="#EAB308" stroke-width="2.5" stroke-linecap="square" opacity="0.85">
    <line x1="42" y1="6" x2="42" y2="16" />
    <line x1="78" y1="6" x2="78" y2="16" />
    <line x1="42" y1="104" x2="42" y2="114" />
    <line x1="78" y1="104" x2="78" y2="114" />
    <line x1="6" y1="42" x2="16" y2="42" />
    <line x1="6" y1="78" x2="16" y2="78" />
    <line x1="104" y1="42" x2="114" y2="42" />
    <line x1="104" y1="78" x2="114" y2="78" />
  </g>

  <!-- Octagonal AMD SEV-SNP Enclave Housing -->
  <polygon points="36,16 84,16 104,36 104,84 84,104 36,104 16,84 16,36"
    fill="#060709" stroke="url(#shunyaGold)" stroke-width="3" />

  <!-- Inner Hardware Isolation Perimeter (Dashed TEE Boundary) -->
  <polygon points="40,23 80,23 97,40 97,80 80,97 40,97 23,80 23,40"
    fill="none" stroke="#EAB308" stroke-width="1" stroke-dasharray="4 3" opacity="0.5" />

  <!-- The Shunya (Zero) Geometric Aperture -->
  <rect x="38" y="31" width="44" height="58" rx="22"
    fill="#0B0F17" stroke="#F3F4F6" stroke-width="6" />

  <!-- RSA-OAEP Diagonal Cipher Laser Slash -->
  <line x1="28" y1="88" x2="92" y2="32"
    stroke="url(#cipherEmerald)" stroke-width="4.5" stroke-linecap="round" filter="url(#enclaveGlow)" />

  <!-- Central Horizon L2 (Chain ID 133) Pulse Core -->
  <circle cx="60" cy="60" r="6" fill="#06B6D4" filter="url(#enclaveGlow)" />

  <!-- Corner Silicon Alignment Micro-Crosses -->
  <path d="M26,38 H30 M28,36 V40 M90,38 H94 M92,36 V40 M26,82 H30 M28,80 V84 M90,82 H94 M92,80 V84"
    stroke="#EAB308" stroke-width="1.2" opacity="0.7" />
</svg>
